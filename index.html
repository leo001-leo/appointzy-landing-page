  <!DOCTYPE html>
  <html lang="mk">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#100e0d" />
      <meta name="robots" content="index, follow, max-image-preview:large" />
      <!-- Scroll-reveal styles are scoped to .js so the prerendered HTML
           stays visible if JavaScript is unavailable. -->
      <script>
        document.documentElement.classList.add("js");
      </script>
      <!-- Meta Pixel (dataset "Appointzy landing"), on the live site only, so
           the dev server and local previews never count visits. The Lead
           event is sent by LeadForm once a request has been saved. -->
      <script>
        if (location.hostname === "info.appointzy.app") {
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '1436631041926440');
          fbq('track', 'PageView');
        }
      </script>
      <!-- Title, description, social tags, hreflang and JSON-LD are written
           per language at build time (src/i18n/head.ts via prerender). The
           title below is only what the dev server shows. Category keyword
           first, brand last: bare "термини" competes with the Мој Термин portal. -->
      <!--app-head-->
      <title>Appointzy</title>
      <!--/app-head-->

      <link rel="icon" href="/favicon.ico" sizes="any" />
      <link rel="icon" href="/favicon-64.png" type="image/png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    </head>

    <body>
      <!-- Meta Pixel for visitors without JavaScript (in body: an img is not
           allowed inside a noscript in head) -->
      <noscript><img height="1" width="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=1436631041926440&amp;ev=PageView&amp;noscript=1" /></noscript>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
