<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Страницата не е најдена · Appointzy</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fbfaf8;
        color: #1c1917;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .wrap { max-width: 26rem; }
      img { height: 26px; width: auto; margin-bottom: 32px; }
      h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 12px; }
      p { color: #78716c; line-height: 1.6; margin: 0 0 28px; }
      a.cta {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        background: #c2410c;
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      a.cta:hover { background: #ea580c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/favicon-64.png" alt="Appointzy" width="64" height="64" />
      <h1>Оваа страница не постои</h1>
      <p>Линкот што го отворивте не е достапен или е променет.</p>
      <a class="cta" href="/">Вратете се на почетна</a>
    </div>
  </body>
</html>
